<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>todo.sh</title>
<style>
  @font-face {
    font-family: 'JetBrains Mono';
    src: local('JetBrains Mono');
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #05070c;
    font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #c9d1d9;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    padding: 40px 16px;
  }
  .term {
    width: 100%;
    max-width: 640px;
    background: #0b0f17;
    border: 1px solid #1c2330;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(111,217,127,0.03);
  }
  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: #0e1420;
    border-bottom: 1px solid #1c2330;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot.r { background: #e5534b; }
  .dot.y { background: #e6b450; }
  .dot.g { background: #6fd97f; }
  .titlebar span {
    margin-left: 8px;
    font-size: 12px;
    color: #5c6779;
    letter-spacing: 0.3px;
  }
  .screen {
    padding: 18px 18px 14px;
  }
  .boot {
    font-size: 12px;
    color: #445066;
    margin: 0 0 14px;
    line-height: 1.6;
  }
  .boot .ok { color: #6fd97f; }
  .stats {
    display: flex;
    gap: 18px;
    font-size: 12px;
    color: #5c6779;
    margin-bottom: 14px;
    padding-bottom: 14px;
    border-bottom: 1px dashed #1c2330;
  }
  .stats b { color: #e6b450; font-weight: 500; }
  .stats .done-count b { color: #6fd97f; }
  #list {
    list-style: none;
    margin: 0 0 16px;
    padding: 0;
    min-height: 30px;
  }
  #list:empty::after {
    content: "// no tasks. write your first line below.";
    color: #3a4356;
    font-size: 13px;
  }
  .task {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 7px 6px;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .task:hover { background: #0f1520; }
  .task .ln {
    color: #2c3444;
    font-size: 12px;
    width: 22px;
    text-align: right;
    flex-shrink: 0;
    padding-top: 2px;
    user-select: none;
  }
  .task .box {
    color: #445066;
    flex-shrink: 0;
    padding-top: 1px;
  }
  .task.done .box { color: #6fd97f; }
  .task .txt {
    flex: 1;
    word-break: break-word;
    color: #d8dee9;
  }
  .task.done .txt {
    color: #3f4a5e;
    text-decoration: line-through;
    text-decoration-color: #2a3242;
  }
  .task .rm {
    opacity: 0;
    color: #e5534b;
    font-size: 12px;
    flex-shrink: 0;
    padding: 2px 4px;
    transition: opacity 0.12s ease;
  }
  .task:hover .rm { opacity: 0.85; }
  .task .rm:hover { opacity: 1; }

  .inputrow {
    display: flex;
    align-items: center;
    gap: 8px;
    border-top: 1px solid #1c2330;
    padding-top: 12px;
  }
  .prompt { color: #6fd97f; font-size: 14px; flex-shrink: 0; }
  #entry {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #d8dee9;
    font-family: inherit;
    font-size: 14px;
    caret-color: #6fd97f;
  }
  #entry::placeholder { color: #3a4356; }
  .cursor {
    display: inline-block;
    width: 7px;
    height: 15px;
    background: #6fd97f;
    animation: blink 1s steps(1) infinite;
    vertical-align: middle;
    margin-left: 1px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .filters {
    display: flex;
    gap: 4px;
    margin-top: 14px;
  }
  .filters button {
    background: transparent;
    border: 1px solid #1c2330;
    color: #5c6779;
    font-family: inherit;
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .filters button:hover { border-color: #2c3444; color: #c9d1d9; }
  .filters button.active {
    border-color: #6fd97f;
    color: #6fd97f;
  }
  .clear-btn {
    margin-left: auto !important;
  }
</style>
</head>
<body>

<div class="term">
  <div class="titlebar">
    <div class="dot r"></div>
    <div class="dot y"></div>
    <div class="dot g"></div>
    <span>todo.sh — zsh</span>
  </div>
  <div class="screen">
    <p class="boot">$ ./todo.sh --init <span class="ok">[ok]</span><br>session started, storage: memory (resets on reload)</p>

    <div class="stats">
      <span>total: <b id="stat-total">0</b></span>
      <span class="done-count">done: <b id="stat-done">0</b></span>
      <span>pending: <b id="stat-pending">0</b></span>
    </div>

    <ul id="list"></ul>

    <div class="inputrow">
      <span class="prompt">$</span>
      <input id="entry" type="text" placeholder="add a task and hit enter" autocomplete="off" />
      <span class="cursor"></span>
    </div>

    <div class="filters">
      <button data-filter="all" class="active">all</button>
      <button data-filter="pending">pending</button>
      <button data-filter="done">done</button>
      <button class="clear-btn" id="clear-done">clear done</button>
    </div>
  </div>
</div>

<script>
  let tasks = [];
  let idCounter = 0;
  let filter = 'all';

  const list = document.getElementById('list');
  const entry = document.getElementById('entry');
  const statTotal = document.getElementById('stat-total');
  const statDone = document.getElementById('stat-done');
  const statPending = document.getElementById('stat-pending');

  function render() {
    list.innerHTML = '';
    const visible = tasks.filter(t => {
      if (filter === 'pending') return !t.done;
      if (filter === 'done') return t.done;
      return true;
    });

    visible.forEach((t, i) => {
      const li = document.createElement('li');
      li.className = 'task' + (t.done ? ' done' : '');

      const ln = document.createElement('span');
      ln.className = 'ln';
      ln.textContent = String(i + 1).padStart(2, '0');

      const box = document.createElement('span');
      box.className = 'box';
      box.textContent = t.done ? '[x]' : '[ ]';

      const txt = document.createElement('span');
      txt.className = 'txt';
      txt.textContent = t.text;

      const rm = document.createElement('span');
      rm.className = 'rm';
      rm.textContent = '✕';
      rm.onclick = (e) => {
        e.stopPropagation();
        tasks = tasks.filter(x => x.id !== t.id);
        render();
      };

      li.onclick = () => {
        t.done = !t.done;
        render();
      };

      li.append(ln, box, txt, rm);
      list.appendChild(li);
    });

    statTotal.textContent = tasks.length;
    statDone.textContent = tasks.filter(t => t.done).length;
    statPending.textContent = tasks.filter(t => !t.done).length;
  }

  entry.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && entry.value.trim()) {
      tasks.push({ id: idCounter++, text: entry.value.trim(), done: false });
      entry.value = '';
      render();
    }
  });

  document.querySelectorAll('.filters button[data-filter]').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.filters button[data-filter]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      render();
    };
  });

  document.getElementById('clear-done').onclick = () => {
    tasks = tasks.filter(t => !t.done);
    render();
  };

  render();
</script>

</body>
</html>
